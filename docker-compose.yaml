# ============================================================================
# FINARK DISTRIBUTED PLATFORM - MASTER SERVICES ORCHESTRATOR MATRIX
# Target File: ./docker-compose.yaml | Milestone 4 Advanced Mesh Topology
# ============================================================================
services:
  # ----------------------------------------------------------------------------
  # CORE STORAGE & DATA ACCELERATION LAYERS
  # ----------------------------------------------------------------------------
  paysprint-postgres:
    image: postgres:16-alpine
    container_name: paysprint-postgres
    networks:
      - paysprint-network
    ports:
      - "5432:5432"
    volumes:
      - ./db/core_ddl:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=paysprint
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD_FILE=/run/secrets/pg_master_pass
    secrets:
      - pg_master_pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paysprint"]
      interval: 10s
      timeout: 5s
      retries: 5

  paysprint-cache:
    image: valkey/valkey:7.2-alpine
    container_name: paysprint-cache
    networks:
      - paysprint-network
    ports:
      - "6379:6379"
    volumes:
      - valkeydata:/data
    command: valkey-server --protected-mode no --save 60 1
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # EVENT STREAMING INFRASTRUCTURE (CONFLUENT PLATFORM)
  # ----------------------------------------------------------------------------
  paysprint-kafka:
    image: confluentinc/cp-kafka:8.3.0
    container_name: paysprint-kafka
    networks:
      - paysprint-network
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://paysprint-kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true' 
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@paysprint-kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ----------------------------------------------------------------------------
  # SYSTEM CORE MICROSERVICES & APPS
  # ----------------------------------------------------------------------------
# ============================================================================
# 🟢 EDGE GATEWAY REALIGNMENT: Injecting true private grid routing parameters
# Location: Inside the api-gateway service block in docker-compose.yaml
# ============================================================================

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    networks:
      - paysprint-network
    ports:
      - "3000:3000"
    environment:
      - "PORT=3000"
      - "JWT_SECRET_FILE=/run/secrets/jwt_shared_secret"
      - "REDIS_HOST=paysprint-cache"
      - "VALKEY_HOST=paysprint-cache"
      - "REDIS_PORT=6379"
    secrets:
      - jwt_shared_secret
    depends_on:
      paysprint-cache:
        condition: service_healthy

  paysprint-auth:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
      additional_contexts:
        finark_core_src: ./packages/finark-core
    container_name: paysprint-auth
    networks:
      - paysprint-network
    ports:
      - "4000:4000"
    environment:
      - "VALKEY_HOST=paysprint-cache"
      - "VALKEY_PORT=6379"
      - "DB_HOST=paysprint-postgres"
      - "JWT_SECRET_FILE=/run/secrets/jwt_shared_secret"
    secrets:
      - jwt_shared_secret
      - pg_master_pass
    depends_on:
      paysprint-postgres:
        condition: service_healthy
      paysprint-cache:
        condition: service_healthy

  order-placement:
    build:
      context: ./services/order-placement-service
      dockerfile: Dockerfile
      additional_contexts:
        finark_core_java_src: ./packages/finark-core-java
    container_name: order-placement
    networks:
      - paysprint-network
    ports:
      - "8080:8080"
    volumes:
      - ./services/order-placement-service/src:/app/src
      - /app/target
      - ./secrets:/secrets:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - "VALKEY_HOST=paysprint-cache"
      - "VALKEY_PORT=6379"
      - "DB_HOST=paysprint-postgres"
      - "FAUXNANCE_API_URL_FILE=/run/secrets/fauxnance_api_url"
      - "FAUXNANCE_API_KEY_FILE=/run/secrets/fauxnance_api_key"
      - "TZ=America/New_York"
      - "JAVA_TOOL_OPTIONS=-Duser.timezone=America/New_York -Djava.net.preferIPv4Stack=true"
    secrets:
      - jwt_shared_secret
      - pg_master_pass
      - fauxnance_api_url
      - fauxnance_api_key
    working_dir: /app
    entrypoint: ["java", "-jar", "order-placement-service.jar"]
    healthcheck:
      test:
        - "CMD"
        - "sh"
        - "-c"
        - |
          jshell -R-Djava.net.preferIPv4Stack=true - << 'EOF'
          import java.net.http.*;
          import java.net.*;
          int statusCode = 0;
          try {
              var client = HttpClient.newBuilder().version(HttpClient.Version.HTTP_1_1).build();
              var request = HttpRequest.newBuilder().uri(URI.create("http://localhost:8080/actuator/health/liveness")).build();
              var response = client.send(request, HttpResponse.BodyHandlers.discarding());
              statusCode = response.statusCode();
          } catch (Exception e) {
              statusCode = 500;
          }
          /exit (statusCode == 200 ? 0 : 1)
          EOF
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      paysprint-cache:
        condition: service_healthy
      paysprint-postgres:
        condition: service_healthy

  orchestrator-sidecar:
    build:
      context: ./services/orchestrator-sidecar
      dockerfile: Dockerfile
    container_name: orchestrator-sidecar
    networks:
      - paysprint-network
    volumes:
      - ./services/orchestrator-sidecar/tasks:/app/tasks
    environment:
      - "DB_HOST=paysprint-postgres"
      - "VALKEY_HOST=paysprint-cache"
      - "KAFKA_BOOTSTRAP_SERVERS=paysprint-kafka:29092"
    secrets:
      - pg_master_pass
      - fauxnance_api_url
      - fauxnance_api_key
    depends_on:
      paysprint-postgres:
        condition: service_healthy
      paysprint-cache:
        condition: service_healthy
      paysprint-kafka:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # DECOUPLED ASYNC ISOLATED HARNESS SUITES
  # ----------------------------------------------------------------------------

  # 🔵 SUITE A: Cold-Path, State-Destructive Relational Database Assertions
  db-test-runner:
    build:
      context: ./test
      dockerfile: Dockerfile
      target: runner-db  # ◄ Targets Stage 2 to isolate run-db-tests.sh natively
    container_name: db-test-runner
    profiles:
      - db_tests
    networks:
      - paysprint-network
    volumes:
      - ./test:/test
      - ./db/fixtures:/fixtures:ro
    environment:
      - "DB_HOST=paysprint-postgres"
      - "VALKEY_HOST=paysprint-cache"
    depends_on:
      paysprint-postgres:
        condition: service_healthy

  # 🟢 SUITE B: Hot-Path, State-Preserving Rest API Handshake Validation Canopy
  api-test-runner:
    build:
      context: ./test
      dockerfile: Dockerfile
      target: runner-api  # ◄ Targets Stage 3 to isolate run-api-tests.sh and package hooks
    container_name: api-test-runner
    profiles:
      - api_tests
    networks:
      - paysprint-network
    volumes:
      - ./test:/test
      - ./packages:/packages:ro
      - ./secrets:/secrets:ro
      - ./db/fixtures:/fixtures:ro
    environment:
      - "DB_HOST=paysprint-postgres"
      - "VALKEY_HOST=paysprint-cache"
    depends_on:
      order-placement:
        condition: service_healthy
      api-gateway:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
  valkeydata:
    driver: local

networks:
  paysprint-network:
    name: paysprint-network
    driver: bridge

secrets:
  jwt_shared_secret:
    file: ./secrets/jwt_shared_secret.txt
  pg_master_pass:
    file: ./secrets/pg_master_pass.txt
  fauxnance_api_url:
    file: ./secrets/fauxnance_api_url.txt
  fauxnance_api_key:
    file: ./secrets/fauxnance_api_key.txt
