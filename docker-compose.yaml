services:
  paysprint-postgres:
    image: postgres:16-alpine
    container_name: paysprint-postgres
    networks:
      - paysprint-network
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: paysprint
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_master_pass
    secrets:
      - pg_master_pass
    volumes:
      - ./db/core_ddl/:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paysprint"]
      interval: 5s
      timeout: 5s
      retries: 5

  paysprint-kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: paysprint-kafka
    networks:
      - paysprint-network
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://paysprint-kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REREPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@paysprint-kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  paysprint-kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: paysprint-kafka-init
    networks:
      - paysprint-network
    depends_on:
      paysprint-kafka:
        condition: service_healthy
    entrypoint: >
      bash -c "
        echo '⏳ Initiating automatic production topic provisioning...' &&
        kafka-topics --create --if-not-exists --bootstrap-server paysprint-kafka:29092 --partitions 1 --replication-factor 1 --topic execution-ledger &&
        kafka-topics --create --if-not-exists --bootstrap-server paysprint-kafka:29092 --partitions 1 --replication-factor 1 --topic compliance-alerts &&
        echo '✅ Production event streaming channels successfully mapped!'
      "

  paysprint-cache:
    image: valkey/valkey:7.2-alpine
    container_name: paysprint-cache
    networks:
      - paysprint-network
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  paysprint-auth:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: paysprint-auth
    networks:
      - paysprint-network
    ports:
      - "4000:4000"
    environment:
      - VALKEY_HOST=paysprint-cache
      - VALKEY_PORT=6379
    secrets:
      - jwt_shared_secret
    depends_on:
      paysprint-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5


  test-runner:
    image: alpine:3.19
    container_name: test-runner
    profiles:
      - db_tests
    networks:
      - paysprint-network
    volumes:
      - ./test:/test
      - ./db/fixtures:/fixtures:ro
      - ./secrets:/secrets:ro
    environment:
      - DB_HOST=paysprint-postgres
    depends_on:
      paysprint-postgres:
        condition: service_healthy
    entrypoint: >
      sh -c "
        apk add --no-cache bash postgresql-client > /dev/null &&
        export PGPASSWORD=$$(cat /secrets/pg_master_pass.txt) &&
        
        echo '⏳ Phase 1: Polling database container TCP port availability...' &&
        until pg_isready -h $$DB_HOST -U postgres -d paysprint; do
          sleep 1
        done &&
        
        echo '⏳ Phase 2: Confirming relational catalog structural completion...' &&
        until psql -h $$DB_HOST -U postgres -d paysprint -t -c \"SELECT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name = 'advisor');\" | grep -q t; do
          sleep 1
        done &&
        
        echo '🧪 Data tier stabilized. Injecting testing fixture dataset...' &&
        psql -h $$DB_HOST -U postgres -d paysprint -f /fixtures/00-test-seed.sql > /dev/null &&
        /test/run-tests.sh
      "

networks:
  paysprint-network:
    name: paysprint-network

secrets:
  pg_master_pass:
    file: ./secrets/pg_master_pass.txt
  jwt_shared_secret:
    file: ./secrets/jwt_shared_secret.txt
