services:
  paysprint-postgres:
    image: postgres:16-alpine
    container_name: paysprint-postgres
    networks:
      - paysprint-network
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: paysprint
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_master_pass
    secrets:
      - pg_master_pass
    volumes:
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paysprint"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  paysprint-network:
    name: paysprint-network

secrets:
  pg_master_pass:
    file: ./secrets/pg_master_pass.txt
