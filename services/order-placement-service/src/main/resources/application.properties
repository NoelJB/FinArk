server.port=8080
server.shutdown=graceful

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/paysprint
spring.datasource.username=postgres
# 🟢 CORRECT MAP: Maps the native secret path using your container's existing variable signature
spring.datasource.password=${DB_PASSWORD:/run/secrets/pg_master_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-executor-type=simple

# 🔐 Hardened: Dynamically map file-based secrets to configuration keys, falling back to basic strings for testing
fauxnance.api.url=${FAUXNANCE_API_URL_FILE:http://localhost:8081}
fauxnance.api.key=${FAUXNANCE_API_KEY_FILE:mock-dev-token}

# 🟢 SPRING BOOT 4.x IMPERATIVE TIMEOUT SPECIFICATIONS:
# Enforces a resilient 5-second baseline ceiling on standard Spring-managed RestClient templates
spring.http.clients.connect-timeout=5000ms
spring.http.clients.read-timeout=5000ms

# Expose the health endpoint
management.endpoints.web.exposure.include=health

# Enable Kubernetes/Docker orchestrator awareness for Liveness & Readiness
management.endpoint.health.probes.enabled=true

logging.level.com.finark.order.mapper=DEBUG
logging.level.org.springframework.web=INFO


# ============================================================================
# TOMCAT 11 COYOTE NETWORK PROTOCOL TELEMETRY DEBUG LOGGING
# ============================================================================
logging.level.org.apache.coyote=DEBUG
logging.level.org.apache.tomcat=DEBUG
logging.level.org.apache.catalina=DEBUG
logging.level.org.springframework.web.filter=TRACE
